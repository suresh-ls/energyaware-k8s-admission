apiVersion: v1
data:
  config.yaml: |
    cpu:
      preferredMeters:
      - rapl
      - hwmon
    debug:
      pprof:
        enabled: false
    dev:
      fake-cpu-meter:
        enabled: true
        zones: []
    experimental:
      gpu:
        dcgmEndpoint: ""
        enabled: false
        idlePower: 0
      hwmon:
        chipRules: []
        forceEnabled: false
        zones: []
      platform:
        redfish:
          configFile: /etc/kepler/redfish.yaml
          enabled: false
          nodeName: ""
    exporter:
      prometheus:
        debugCollectors:
        - go
        enabled: true
      stdout:
        enabled: false
    host:
      procfs: /host/proc
      sysfs: /host/sys
    kube:
      config: ""
      enabled: false
      nodeName: ""
      podInformer:
        mode: kubelet
        pollInterval: 15s
    log:
      format: text
      level: debug
    monitor:
      interval: 5s
      maxTerminated: 100
      minTerminatedEnergyThreshold: 10
      staleness: 500ms
    rapl:
      zones: []
    web:
      configFile: ""
      listenAddresses:
      - :28282
