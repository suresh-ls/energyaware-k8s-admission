# ServiceMonitor that tells Prometheus (kube-prometheus-stack) to scrape Kepler.
# The setup script generates an equivalent one automatically; this file is for
# applying it by hand:  kubectl apply -f deploy/kepler-servicemonitor.yaml
#
# The selector label and port name must match the kepler Service. Check with:
#   kubectl get svc kepler -n kepler -o yaml | grep -B2 -A6 -E "labels:|ports:"
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kepler
  namespace: kepler
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kepler
  endpoints:
    - port: http
      interval: 15s