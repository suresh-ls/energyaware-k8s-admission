name: Cloud spot compatibility

on:
  push:
    branches: [feature/cloud-spot-pricing]
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: '1.27.4'
          cache-dependency-path: controller/go.sum
      - name: Test existing signals and decision engine
        run: go test -race ./internal/signals/... ./internal/decision-engine
      - name: Test controller integration with a fake Kubernetes client
        run: go test -race ./internal/controller -run '^TestCloudSpot'
      - name: Build controller and check Go diagnostics
        run: |
          go build -o /tmp/energygate ./cmd/main.go
          go vet ./cmd/... ./internal/...
      - name: Check module consistency
        run: |
          go version
          go env GOVERSION GOOS GOARCH GOTOOLCHAIN GOFLAGS
          go mod tidy
          git diff --exit-code -- go.mod go.sum
